services:
  steamer:
    # image: docker.io/odevsa/steamer:latest
    image: steamer
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: steamer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
    volumes:
      - ./.steamer/data:/app/data
