version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: steamer_web_1
      APP_PORT: 8080

  web:
    image: odevsa/steamer:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATA_DIR: /app/data
      RUST_LOG: info
